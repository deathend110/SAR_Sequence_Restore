# 在项目根目录运行；CUDA_VISIBLE_DEVICES=0,1，官方 BasicSR DDP。
name: hint_sar_single
model_type: SRModel
scale: 1
num_gpu: 2
manual_seed: 42

datasets:
  train:
    name: sar_train
    type: SARSingleDataset
    dataroot_lq: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/LQ
    dataroot_gt: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/GT
    split_file: docs/splits/sar_single_seed42/train.txt
    gt_size: 128
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 6  # DDP 下每个 rank batch 6，两卡合计 global batch 12。
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val:
    name: sar_test
    type: SARSingleDataset
    dataroot_lq: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/LQ
    dataroot_gt: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/GT
    split_file: docs/splits/sar_single_seed42/test.txt

network_g:
  type: HINT
  inp_channels: 1
  out_channels: 1
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [8, 8, 8, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: WithBias
  dual_pixel_task: false

path:
  pretrain_network_g: ~
  strict_load_g: true
  param_key_g: params
  resume_state: ~

train:
  total_iter: 2200000
  warmup_iter: -1
  ema_decay: 0
  optim_g:
    type: Adam
    lr: !!float 1.732e-4
    weight_decay: 0
    betas: [0.9, 0.999]
  scheduler:
    type: MultiStepLR
    milestones: [1066667, 1600000, 1866667, 2000000, 2133333]
    gamma: 0.5
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-9

val:
  val_freq: 6667
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 267
  save_checkpoint_freq: 6667
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
