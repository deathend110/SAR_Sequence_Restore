[build-system]
requires = ["setuptools<81", "wheel", "cython", "numpy==1.26.4", "torch==2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basicsr"
version = "1.4.2"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies", "description", "readme", "license", "authors", "keywords", "classifiers", "urls"]

[project.optional-dependencies]
sar = ["einops", "matplotlib"]

[dependency-groups]
dev = ["pytest", "scikit-learn", "timm"]

[tool.uv]
constraint-dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "numpy==1.26.4",
  "opencv-python==4.11.0.86", "setuptools<81",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
