# UCAN 双 4090 SAR 适配：每卡 batch 6、global batch 12、40 万步；优化器/调度参考论文。
# 全 Q=2 对比实验；与原 H/L UCAN 共用训练参数和 seed42 数据划分。
# 在项目根目录运行；选择两张空闲 4090（如 CUDA_VISIBLE_DEVICES=1,3），双进程 DDP。
name: ucan_sar_single_q2
model_type: UCANModel
scale: 1
num_gpu: 2
manual_seed: 42
final_test_opt: options/SAR/test_ucan_single_q2.yml

datasets:
  train:
    name: sar_train
    type: SARSingleDataset
    dataroot_lq: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_q2_s0_fr1p3_fa0p4_phi0_lp0p99_hp99p9_roi600/LQ
    dataroot_gt: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_q2_s0_fr1p3_fa0p4_phi0_lp0p99_hp99p9_roi600/GT
    split_file: docs/splits/sar_single_seed42/train.txt
    gt_size: 128
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 6  # 双卡短测通过：每个 rank 6，两卡合计 12。
    dataset_enlarge_ratio: 1
    prefetch_mode: ~
  val:
    name: sar_val
    type: SARSingleDataset
    dataroot_lq: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_q2_s0_fr1p3_fa0p4_phi0_lp0p99_hp99p9_roi600/LQ
    dataroot_gt: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_q2_s0_fr1p3_fa0p4_phi0_lp0p99_hp99p9_roi600/GT
    split_file: docs/splits/sar_single_seed42/val.txt

network_g:
  type: UCAN
  upscale: 1
  in_chans: 1
  img_size: 128
  embed_dim: 48
  window_size: 16
  img_range: 1.0
  mlp_ratio: 1.0
  conv_depth: 5
  share: [N, F, N, F]
  mhsa_num_heads: 2
  dfl_num_heads: 1
  use_checkpoint: false
  upsampler: ~  # 使用官方同分辨率残差恢复分支。
  resi_connection: 1conv

path:
  pretrain_network_g: ~
  strict_load_g: true
  param_key_g: params
  resume_state: ~

train:
  total_iter: 400000  # 12 × 40 万 = 480 万 patch，与其他 SAR 基线曝光量一致。
  warmup_iter: -1
  ema_decay: 0
  optim_g:
    type: Adam
    lr: !!float 3.75e-4  # 参考论文 global batch 比例：5e-4 × 12/16。
    weight_decay: 0
    betas: [0.9, 0.99]  # 沿用论文 Adam beta2。
  scheduler:
    type: MultiStepLR
    milestones: [150000, 250000, 325000, 350000, 375000]  # 论文衰减节点按训练进度映射到 40 万步。
    gamma: 0.5
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-9

val:
  val_freq: 10000  # 每 12 万 patch 完整验证一次，与保存间隔一致。
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 134
  save_checkpoint_freq: 10000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
