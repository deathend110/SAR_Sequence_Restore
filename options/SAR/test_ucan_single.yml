# UCAN 单通道同分辨率恢复；训练预算与 SwinIR 保持一致，batch 暂不扩大。
# 训练正常结束后的独立 SAR 测试；使用最终权重并保存恢复图。
name: ucan_sar_single
model_type: UCANModel
scale: 1
num_gpu: 1
manual_seed: 42

datasets:
  test:
    name: sar_test
    type: SARSingleDataset
    dataroot_lq: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/LQ
    dataroot_gt: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/GT
    split_file: docs/splits/sar_single_seed42/test.txt

network_g:
  type: UCAN
  upscale: 1
  in_chans: 1
  img_size: 128
  embed_dim: 48
  window_size: 16
  img_range: 1.0
  mlp_ratio: 1.0
  conv_depth: 5
  share: [N, F, N, F]
  mhsa_num_heads: 2
  dfl_num_heads: 1
  use_checkpoint: false
  upsampler: ~  # 使用官方同分辨率残差恢复分支。
  resi_connection: 1conv

path:
  pretrain_network_g: experiments/ucan_sar_single/models/net_g_latest.pth
  strict_load_g: true
  param_key_g: params

val:
  save_img: true
  pbar: false
  suffix: ~
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
