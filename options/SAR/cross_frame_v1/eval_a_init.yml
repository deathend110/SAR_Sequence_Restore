# 统一评估单帧骨干 A_init 在 scene_split_v1 验证/测试集上的序列指标（支持自动加载单帧 UCAN 检查点）。
name: eval_a_init

datasets:
  test:
    name: sar_test
    dataroot_lq: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/LQ
    dataroot_gt: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/GT
    split_file: docs/UCAN_exp1/splits/scene_split_v1/test.txt

network_g:
  type: UCANSequence
  backbone_opt:
    type: UCAN
    upscale: 1
    in_chans: 1
    img_size: 128
    embed_dim: 48
    window_size: 16
    img_range: 1.0
    mlp_ratio: 1.0
    conv_depth: 5
    share: [N, F, N, F]
    mhsa_num_heads: 2
    dfl_num_heads: 1
    use_checkpoint: false
    upsampler: ~
    resi_connection: 1conv
    lksa_gate_gamma: 4.0
  token_opt:
    enabled: false
  checkpoint_rg_pair: false
  eval_frame_batch_size: 1
  train_frame_chunk_size: 0

path:
  param_key_g: params
