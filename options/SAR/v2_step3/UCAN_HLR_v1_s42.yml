# Step 3 跨帧架构升级（Branch 3-R：UCAN-HLR）：
# 在 RG2 后引入高度尺度无关频域-空间联合校准 (Stage1)，在 RG4 后引入物理 8x8 高频 H->L 检索与非对称质量门控 (Stage2)。
# 基于 GPU 0 24GB 探针选择最安全高速组合：H=128, BF16 混合精度, bs=2/GPU, chunk=2 (峰值显存 16.61 GiB, 0.53 seq/s)。
name: ucan_seq_HLR_v1_s42
model_type: UCANSequenceModel
scale: 1
num_gpu: 2
manual_seed: 42

datasets:
  train:
    name: sar_seq_train
    type: SARSequenceDataset
    dataroot_lq: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/LQ
    dataroot_gt: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/GT
    split_file: docs/UCAN_exp1/splits/scene_split_v1/train.txt
    crop_height: 128
    deterministic_crop_seed: 42
    grid_h: 4
    grid_w: 4
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: null
  val:
    name: sar_seq_val
    type: SARSequenceDataset
    dataroot_lq: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/LQ
    dataroot_gt: /data/cjz/SAR_Transformer/dataset_range_2dsft/range_2d_sft_qh2p5_ql1p5_s1_fr0p9_fa0p5_phi0_lp0p99_hp99p9_roi600_eb64/GT
    split_file: docs/UCAN_exp1/splits/scene_split_v1/val.txt
    crop_height: null
    grid_h: 4
    grid_w: 4

network_g:
  type: UCANSequence
  backbone_opt:
    type: UCAN
    upscale: 1
    in_chans: 1
    img_size: 128
    embed_dim: 48
    window_size: 16
    img_range: 1.0
    mlp_ratio: 1.0
    conv_depth: 5
    share:
    - N
    - F
    - N
    - F
    mhsa_num_heads: 2
    dfl_num_heads: 1
    use_checkpoint: false
    upsampler: null
    resi_connection: 1conv
    lksa_gate_gamma: 4.0
  token_opt: null
  hlr_opt:
    enabled: true
    stage1_enabled: true
    stage2_enabled: true
    stage1_opt:
      token_dim: 128
      num_heads: 4
      num_layers: 3
      ffn_ratio: 2.0
      num_frames: 9
      grid_w: 4
      num_freq_bands: 8
    stage2_opt:
      embed_dim: 128
      num_heads: 4
      num_protos: 128
      num_frames: 9
      max_patch_cols: 64
      ffn_ratio: 2.0
      alpha_h_init_logit: -2.0
  train_frame_chunk_size: 2
  eval_frame_batch_size: 1

path:
  pretrain_backbone_g: experiments/ucan_a_init_scene_v1/models/net_g_best_psnr.pth
  strict_load_g: true
  param_key_g: params
  resume_state: null

train:
  total_iter: 6000
  warmup_iter: -1
  ema_decay: 0.9985
  ema_warmup: true
  amp_dtype: bf16
  freeze_backbone_iters: 1500
  backbone_lr: 1.5e-05
  grad_clip_norm: 1.0
  l_region_weight: 3.0
  f4_frame_weight: 1.5
  overlap_consistency_weight: 0.2
  grad_loss_weight: 0.1
  ssim_loss_weight: 0.05
  optim_g:
    type: Adam
    lr: 0.00015
    weight_decay: 0
    betas:
    - 0.9
    - 0.99
  scheduler:
    type: MultiStepLR
    milestones:
    - 4000
    - 5200
    gamma: 0.5
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: 1.0e-09

val:
  val_freq: 6000
  val_iters: &id001
  - 1500
  - 3000
  - 4500
  - 6000
  save_img: false
  pbar: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 200
  save_checkpoint_freq: 6000
  save_checkpoint_iters: *id001
  use_tb_logger: true
  wandb:
    project: null
    resume_id: null
